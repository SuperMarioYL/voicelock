[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicelock"
version = "0.6.0"
description = "去AI味 for 小红书 正文 — learn your account-voice fingerprint, flag 爆款体 slop regions, and rewrite AI drafts in your own voice."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SuperMarioYL" }]
keywords = ["xiaohongshu", "anti-slop", "voice-fingerprint", "cli", "china-ai", "content-creation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.12",
    "openai>=1.40",
    "jieba>=0.42",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/voicelock"
Repository = "https://github.com/SuperMarioYL/voicelock"
Issues = "https://github.com/SuperMarioYL/voicelock/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
voicelock = "voicelock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicelock = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
