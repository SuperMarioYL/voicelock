name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build   # writes wheel + sdist into dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi:
    name: publish to PyPI (opt-in)
    needs: build
    runs-on: ubuntu-latest
    # Opt-in only. A fresh repo has no PyPI Trusted Publisher registered, so an
    # always-on job would fail the first release with `invalid-publisher`. Set
    # the repo variable PYPI_PUBLISH=true (and register the Trusted Publisher)
    # when you actually want to ship to PyPI.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Remove non-package files
        run: rm -f dist/checksums.txt

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
