<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="voicelock — 去AI味 for 小红书 正文">
  <defs>
    <linearGradient id="hg" x1="-220%" y1="0%" x2="-100%" y2="0%">
      <stop offset="0%"  stop-color="#5E5CE6"/>
      <stop offset="50%" stop-color="#10A37F"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
      <animate attributeName="x1" values="-220%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100%;220%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#F5F5F7"/>

  <!-- decorative "voiceprint" waveform bars behind the title (breathing, infinite) -->
  <g transform="translate(0,232)" opacity="0.55">
    <rect x="150" y="-10" width="5" height="20" rx="2.5" fill="#5E5CE6">
      <animate attributeName="height" values="10;30;10" keyTimes="0;0.5;1" dur="2.2s" begin="-0.1s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="-5;-15;-5" keyTimes="0;0.5;1" dur="2.2s" begin="-0.1s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <rect x="166" y="-16" width="5" height="32" rx="2.5" fill="#7B79EE">
      <animate attributeName="height" values="26;14;26" keyTimes="0;0.5;1" dur="2.2s" begin="-0.5s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="-13;-7;-13" keyTimes="0;0.5;1" dur="2.2s" begin="-0.5s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <rect x="182" y="-22" width="5" height="44" rx="2.5" fill="#10A37F">
      <animate attributeName="height" values="18;40;18" keyTimes="0;0.5;1" dur="2.2s" begin="-0.9s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="-9;-20;-9" keyTimes="0;0.5;1" dur="2.2s" begin="-0.9s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <rect x="693" y="-22" width="5" height="44" rx="2.5" fill="#10A37F">
      <animate attributeName="height" values="40;18;40" keyTimes="0;0.5;1" dur="2.2s" begin="-0.3s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-9;-20" keyTimes="0;0.5;1" dur="2.2s" begin="-0.3s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <rect x="709" y="-16" width="5" height="32" rx="2.5" fill="#7B79EE">
      <animate attributeName="height" values="14;30;14" keyTimes="0;0.5;1" dur="2.2s" begin="-0.7s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="-7;-15;-7" keyTimes="0;0.5;1" dur="2.2s" begin="-0.7s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <rect x="725" y="-10" width="5" height="20" rx="2.5" fill="#5E5CE6">
      <animate attributeName="height" values="30;10;30" keyTimes="0;0.5;1" dur="2.2s" begin="-1.1s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="-15;-5;-15" keyTimes="0;0.5;1" dur="2.2s" begin="-1.1s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="440" y="150" text-anchor="middle" font-size="58" font-weight="700" fill="url(#hg)">voicelock</text>

  <!-- tagline: one-shot fade-in + rise (decorative only) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.4s" dur="0.8s" fill="freeze"/>
    <text x="440" y="196" text-anchor="middle" font-size="17" font-weight="500" fill="#6E6E73">去AI味 · account-voice fingerprint for 小红书 正文</text>
  </g>

  <!-- domain pulse dot -->
  <circle cx="440" cy="252" r="3" fill="#5E5CE6">
    <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.5;1" dur="2.4s"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </circle>
</svg>
