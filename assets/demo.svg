<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="demo：爆款体草稿 slop 87 被逐句去AI味重写，分数降到 12，声线一致性拉满">
  <rect x="0" y="0" width="880" height="380" fill="#F5F5F7"/>

  <!-- header -->
  <text x="40" y="46" font-size="18" font-weight="700" fill="#1D1D1F">voicelock rewrite draft.txt</text>
  <text x="40" y="68" font-size="12" fill="#6E6E73">去AI味 · account-voice fingerprint · offline mock backend</text>

  <!-- ================= slop score gauge ================= -->
  <g transform="translate(660,44)">
    <text x="90" y="-6" text-anchor="end" font-size="12" fill="#6E6E73">slop score</text>
    <rect x="0" y="4" width="180" height="14" rx="7" fill="#E3232D" fill-opacity="0.16"/>
    <rect x="0" y="4" width="180" height="14" rx="7" fill="#E3232D">
      <!-- 87% → 54% → 12% of 180 = 156.6 → 97.2 → 21.6 -->
      <animate attributeName="width" values="156.6;156.6;97.2;97.2;21.6;21.6;156.6"
               keyTimes="0;0.18;0.30;0.52;0.64;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#E3232D;#E3232D;#E8973A;#E8973A;#10A37F;#10A37F;#E3232D"
               keyTimes="0;0.18;0.30;0.52;0.64;0.92;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="90" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#E3232D">
      <animate attributeName="fill" values="#E3232D;#E3232D;#E8973A;#E8973A;#10A37F;#10A37F;#E3232D"
               keyTimes="0;0.18;0.30;0.52;0.64;0.92;1" dur="9s" repeatCount="indefinite"/>
      87
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.17;0.19;0.6;0.9;0.99;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#E8973A" opacity="0">
      54
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.29;0.31;0.51;0.53;0.99;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#10A37F" opacity="0">
      12
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.65;0.92;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ================= draft lines ================= -->
  <!-- each line: red slop box that flips to green as it is rewritten -->

  <!-- line 1 -->
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="600" height="42" rx="10" fill="#E3232D" fill-opacity="0.12" stroke="#E3232D" stroke-width="1.4">
      <animate attributeName="stroke" values="#E3232D;#E3232D;#10A37F;#10A37F;#E3232D" keyTimes="0;0.20;0.24;0.95;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#E3232D;#E3232D;#10A37F;#10A37F;#E3232D" keyTimes="0;0.20;0.24;0.95;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="16" y="27" font-size="15" fill="#1D1D1F">
      <tspan opacity="1">姐妹们！！！这家咖啡馆真的绝绝子😭😭😭
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.20;0.24;0.95;1" dur="9s" repeatCount="indefinite"/>
      </tspan>
    </text>
    <text x="16" y="27" font-size="15" fill="#0B6B53" opacity="0">这家咖啡馆真的很不错。
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.23;0.25;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="27" text-anchor="end" font-size="12" font-weight="600" fill="#E3232D">爆款体
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.20;0.24;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="27" text-anchor="end" font-size="12" font-weight="600" fill="#10A37F" opacity="0">✓ 你的声线
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.23;0.25;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- line 2 -->
  <g transform="translate(40,162)">
    <rect x="0" y="0" width="600" height="42" rx="10" fill="#E3232D" fill-opacity="0.12" stroke="#E3232D" stroke-width="1.4">
      <animate attributeName="stroke" values="#E3232D;#E3232D;#10A37F;#10A37F;#E3232D" keyTimes="0;0.42;0.46;0.95;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#E3232D;#E3232D;#10A37F;#10A37F;#E3232D" keyTimes="0;0.42;0.46;0.95;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="16" y="27" font-size="15" fill="#1D1D1F">
      <tspan opacity="1">谁懂啊家人们直接封神yyds！！！
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.46;0.95;1" dur="9s" repeatCount="indefinite"/>
      </tspan>
    </text>
    <text x="16" y="27" font-size="15" fill="#0B6B53" opacity="0">这家的手冲我一喝就记住了。
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="27" text-anchor="end" font-size="12" font-weight="600" fill="#E3232D">爆款体
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.46;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="27" text-anchor="end" font-size="12" font-weight="600" fill="#10A37F" opacity="0">✓ 你的声线
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- line 3 -->
  <g transform="translate(40,214)">
    <rect x="0" y="0" width="600" height="42" rx="10" fill="#E3232D" fill-opacity="0.12" stroke="#E3232D" stroke-width="1.4">
      <animate attributeName="stroke" values="#E3232D;#E3232D;#10A37F;#10A37F;#E3232D" keyTimes="0;0.62;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#E3232D;#E3232D;#10A37F;#10A37F;#E3232D" keyTimes="0;0.62;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="16" y="27" font-size="15" fill="#1D1D1F">
      <tspan opacity="1">手把手教你三步找到宝藏店，建议收藏码住🔥🔥🔥
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.62;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
      </tspan>
    </text>
    <text x="16" y="27" font-size="15" fill="#0B6B53" opacity="0">分享一下我找这家店的三步，供你参考。
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.67;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="27" text-anchor="end" font-size="12" font-weight="600" fill="#E3232D">爆款体
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.62;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="27" text-anchor="end" font-size="12" font-weight="600" fill="#10A37F" opacity="0">✓ 你的声线
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.67;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ================= voice-consistency bar ================= -->
  <g transform="translate(40,300)">
    <text x="0" y="0" font-size="12" fill="#6E6E73">voice-consistency（声线一致性）</text>
    <rect x="0" y="10" width="600" height="16" rx="8" fill="#5E5CE6" fill-opacity="0.14"/>
    <rect x="0" y="10" width="0" height="16" rx="8" fill="#5E5CE6">
      <!-- fills as regions flip green: 0.32 → 0.61 → 0.83 → 0.96 of 600 -->
      <animate attributeName="width" values="192;192;366;366;498;498;576;576;192"
               keyTimes="0;0.20;0.24;0.44;0.46;0.64;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="23" text-anchor="end" font-size="12" font-weight="700" fill="#4B3FC4">0.96
      <animate attributeName="opacity" values="0.3;0.3;1;1;0.3" keyTimes="0;0.63;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- caption -->
  <text x="440" y="358" text-anchor="middle" font-size="13" font-weight="500" fill="#6E6E73">
    5 处爆款体 → 逐句在你自己的声线内重写 · slop 87 → 12
  </text>
</svg>
