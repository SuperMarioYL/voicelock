<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="架构：发布历史 → 声线指纹 → 爆款体检测 → 在声线内重写 → 去AI味正文">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <!-- static connector baselines -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="196" y1="120" x2="236" y2="120" marker-end="url(#ah-d)"/>
    <line x1="404" y1="120" x2="444" y2="120" marker-end="url(#ah-d)"/>
    <line x1="612" y1="120" x2="652" y2="120" marker-end="url(#ah-d)"/>
    <path d="M528,164 C528,232 320,232 320,168" marker-end="url(#ah-d)"/>
    <line x1="736" y1="164" x2="736" y2="256" marker-end="url(#ah-d)"/>
  </g>

  <!-- marching-dash data flow -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="196" y1="120" x2="232" y2="120" stroke="#4DA3FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="404" y1="120" x2="440" y2="120" stroke="#8985FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="612" y1="120" x2="648" y2="120" stroke="#8985FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="736" y1="168" x2="736" y2="252" stroke="#2DC79A" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- flowing packet dots -->
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M196,120 L232,120" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M404,120 L440,120" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M612,120 L648,120" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M736,168 L736,252" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <rect x="26" y="80" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.10" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="111" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#9CCBFF">发布历史</text>
    <text x="111" y="136" text-anchor="middle" font-size="11" fill="#A1A1A8">your own 笔记 corpus</text>

    <rect x="236" y="80" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.10" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="321" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#BCB9FF">声线指纹</text>
    <text x="321" y="136" text-anchor="middle" font-size="11" fill="#A1A1A8">VoiceProfile (asset)</text>

    <rect x="444" y="80" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.10" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.4s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="529" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#BCB9FF">爆款体检测</text>
    <text x="529" y="136" text-anchor="middle" font-size="11" fill="#A1A1A8">slop score + regions</text>

    <rect x="652" y="80" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.10" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.0s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="737" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#7EE3C4">在声线内重写</text>
    <text x="737" y="136" text-anchor="middle" font-size="11" fill="#A1A1A8">mock · llm backend</text>

    <rect x="652" y="256" width="170" height="72" rx="15" fill="#2DC79A" fill-opacity="0.10" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.6s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="737" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#7EE3C4">去AI味正文</text>
    <text x="737" y="309" text-anchor="middle" font-size="11" fill="#A1A1A8">before/after · 87→12</text>
  </g>

  <text x="320" y="250" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">re-check loop（重写后回检）</text>
</svg>
